# ========================================================================
# 生产环境配置 / Production profile
# 启动: java -jar xxx.jar --spring.profiles.active=prod
# 所有敏感信息通过环境变量注入, 不写入代码 / Secrets are injected via env vars, never hardcoded
# Windows 示例 / Windows example:
#   set SPRING_DATASOURCE_USERNAME=ADS_ADMIN
#   set SPRING_DATASOURCE_PASSWORD=********
#   set JWT_SECRET=********
# ========================================================================

# ---- 数据库 / Database (后端与MySQL同机, 走 localhost) ----
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ADMIRE_CARS?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ADS_PRD}
# 密码不写在配置里: 用环境变量或命令行参数传入明文
# 注意不要填 ENC(...), 除非同时配置了 jasypt.encryptor.password
# Password is not stored here: pass plaintext via env var or command line.
# Do NOT put ENC(...) here unless jasypt.encryptor.password is configured.
#spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ENC(pjyKjQfCcl8V7kyJLwpl8jfg2fprHLtpPmeh2j6Hq2txtYzL1UM8o7gWXZffig3J)}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}

spring.datasource.hikari.pool-name=AdsRunnerHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=240000
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.validation-timeout=5000

spring.jpa.show-sql=false

# ---- JWT / JWT secret (生产必须用环境变量注入 32 位以上随机串) ----
jwt.secret=${JWT_SECRET:ads_runner_secret_key}
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:1800}

# ---- 日志 / Logging (路径可用 LOG_FILE_NAME 覆盖, 目录需存在) ----
logging.file.name=${LOG_FILE_NAME:logs/application.log}
logging.level.root=INFO
logging.level.com.admire.cars.runner=INFO
logging.file.max-size=10MB
logging.file.max-history=10

# ---- Tracker 中转配置 / Tracker redirect config ----
# 中转域名根地址, 巡检自检会用它拼 /r/{slug} / public tracker domain used to build /r/{slug}
tracker.base-url=${TRACKER_BASE_URL:https://track.lunalvabeau.com}
# campaign 不可用时的兜底地址 / fallback destination when a campaign is unavailable
tracker.fallback-url=${TRACKER_FALLBACK_URL:}
