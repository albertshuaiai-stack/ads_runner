spring.application.name=ads_runner
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/ADMIRE_CARS?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=ADS_ADMIN
spring.datasource.password=Ads!290127
spring.datasource.hikari.pool-name=AdsRunnerHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=240000
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.validation-timeout=5000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.physical-strategy=com.admire.cars.runner.config.MixedPhysicalNamingStrategy
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.quartz.job-store-type=jdbc
spring.quartz.jdbc.initialize-schema=never
spring.quartz.properties.org.quartz.scheduler.instanceName=MyScheduler
spring.quartz.properties.org.quartz.jobStore.class=org.springframework.scheduling.quartz.LocalDataSourceJobStore
spring.quartz.properties.org.quartz.jobStore.driverDelegateClass=org.quartz.impl.jdbcjobstore.StdJDBCDelegate
spring.quartz.properties.org.quartz.jobStore.tablePrefix=QRTZ_
spring.quartz.properties.org.quartz.jobStore.isClustered=false
spring.quartz.properties.org.quartz.threadPool.class=org.quartz.simpl.SimpleThreadPool
spring.quartz.properties.org.quartz.threadPool.threadCount=5
spring.quartz.properties.org.quartz.threadPool.threadPriority=5
spring.quartz.properties.org.quartz.threadPool.makeThreadsDaemons=true

# Liquibase
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.enabled=true
spring.liquibase.drop-first=false

# JWT settings
jwt.secret=ads_runner_secret_key
jwt.expiration-seconds=1800

# Housekeeping job retention settings
housekeeping.shift-link-log.retention-days=7
housekeeping.normal.shift-link.retention-days=1
housekeeping.matrix.shift-link.retention-days=1
# Matrix absolute retention: purge consumed or not after 30 days
housekeeping.matrix.shift-link.absolute-retention-days=30
housekeeping.ads-task-log.retention-days=1

# Currency exchange rate job settings
exchange-rate.api.url=https://api.frankfurter.app/latest?from=USD&to=CNY

# Ads normal task settings
auto.task.max.redirects=10
auto.task.connect.timeout.millis=5000
auto.task.request.timeout.millis=10000

ip.verification.switch=true
ip.lookup.url=https://api.country.is/

# Shift link click capacity (global): switch to the next link after this many real clicks
# Shared by all links of the same type; takes effect for every link after restart
shift-link.click-capacity.normal=1
shift-link.click-capacity.matrix=10

# Matrix auto task daily generation cap (per campaign, JVM local calendar day)
# Links created before today are purged on the next job run, then at most daily-limit links are generated today.
# enabled=false disables both the cap and the daily purge; daily-limit<=0 pauses matrix auto generation.
shift-link.matrix.daily-limit.enabled=true
shift-link.matrix.daily-limit=24

# Normal auto task daily generation cap (per campaign, JVM local calendar day)
# Each day starts with base links; every click report adds (new clicks - previous clicks) * click-multiplier.
# Unused allowance carries over to later hours of the same day; enabled=false removes the cap.
shift-link.normal.daily-limit.enabled=true
shift-link.normal.daily-limit.base=20
shift-link.normal.daily-limit.click-multiplier=25

# Logging configuration
logging.level.root=INFO
logging.level.com.admire.cars.runner=INFO
logging.file.name=/opt/app/log/application.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=3
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

